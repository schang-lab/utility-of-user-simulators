# Nginx configuration for the pairwise evaluation app.
# Replace eval.example.com with your own domain throughout this file.
# Place at: /etc/nginx/sites-available/eval.example.com
# Then: sudo ln -s /etc/nginx/sites-available/eval.example.com /etc/nginx/sites-enabled/
# Run certbot after: sudo certbot --nginx -d eval.example.com

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name eval.example.com;
    return 301 https://$host$request_uri;
}

# HTTPS — Nginx terminates TLS, forwards to Uvicorn on 127.0.0.1:7860
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eval.example.com;
    access_log off;

    # Certbot will fill these in automatically when you run:
    #   sudo certbot --nginx -d eval.example.com
    # ssl_certificate     /etc/letsencrypt/live/eval.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/eval.example.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Larger body for long prompts
    client_max_body_size 8M;

    # Increase timeouts — LLM inference can be slow
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass         http://127.0.0.1:7860;
        proxy_http_version 1.1;

        # Tell Uvicorn the original host and protocol
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (in case you add streaming later)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
